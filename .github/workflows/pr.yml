# Checks pull requests for changelog and project rules
name: pr
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - ready_for_review
permissions:
  contents: read
  pull-requests: read
jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - run: npx --yes yokoten@0.2.0 check --pr
        env:
          YOKOTEN_PR_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
